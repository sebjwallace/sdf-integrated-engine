<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view" aria-label="3D view. Drag to rotate, scroll to zoom, WASD to fly."></canvas>
  <header>
    <div class="row">
      <label for="scene">Scene</label>
      <select id="scene"></select>
      <label for="mode">Renderer</label>
      <select id="mode">
        <option value="baked">Baked grid</option>
        <option value="live">Live</option>
      </select>
      <label for="grid">Grid</label>
      <select id="grid">
        <option value="4000000">4M voxels</option>
        <option value="16000000" selected>16M voxels</option>
        <option value="64000000">64M voxels</option>
      </select>
    </div>
    <div class="row" role="group" aria-label="Edit tools">
      <button data-tool="hole" aria-pressed="false">Add hole</button>
      <button data-tool="cut" aria-pressed="false">Add box cut</button>
      <button data-tool="blob" aria-pressed="false">Add blob</button>
      <button id="clear">Clear edits</button>
      <button id="pause" hidden>Pause</button>
      <button id="drop" hidden>Drop again</button>
    </div>
    <div class="row" role="group" aria-label="Cutaway">
      <label for="cut">Cutaway</label>
      <input id="cut" type="range" min="0" max="100" step="0.5" value="0">
      <output id="cut-value" for="cut">Off</output>
      <label for="cut-axis">Axis</label>
      <select id="cut-axis">
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
      <button id="cut-flip" aria-pressed="false">Flip side</button>
    </div>
    <p id="stats" aria-live="off"></p>
  </header>
  <p id="hint">Drag to rotate · Scroll to zoom · Shift-drag to pan · WASD to fly, Q/E down/up, Shift for speed, hold Space and move to look around · Double-click to reset<span id="edit-hints"> · Pick a tool, then press on the model · Drag an edit to move it · Scroll over it to resize · Delete removes it</span><span id="physics-hint" hidden> · Drag a body to throw it</span></p>
  <p id="error" role="alert" hidden></p>

  <script src="sdf.js"></script>
  <script src="field.js"></script>
  <script src="physics.js"></script>
  <script src="renderer.js"></script>
  <script src="scenes.js"></script>
  <script>
    const picker = document.getElementById('scene');
    const errorBox = document.getElementById('error');
    const showError = (message) => {
      errorBox.textContent = message;
      errorBox.hidden = false;
      console.error(message);
    };

    try {
      const modePicker = document.getElementById('mode');
      const gridPicker = document.getElementById('grid');
      const stats = document.getElementById('stats');
      const toolButtons = [...document.querySelectorAll('[data-tool]')];
      const clearButton = document.getElementById('clear');
      const cutSlider = document.getElementById('cut');
      const cutAxis = document.getElementById('cut-axis');
      const cutFlip = document.getElementById('cut-flip');
      const cutValue = document.getElementById('cut-value');
      const pauseButton = document.getElementById('pause');
      const dropButton = document.getElementById('drop');
      const refresh = () => {
        const v = window.viewer;
        if (!v) return;
        stats.textContent = v.describe();
        if (v.cut) {
          cutSlider.value = v.cut.amount * 100;
          cutAxis.value = v.cut.axis;
          cutFlip.setAttribute('aria-pressed', v.cut.flip);
          cutValue.textContent = v.cut.amount > 0 ? `${Math.round(v.cut.amount * 100)}%` : 'Off';
        }
        const animated = !!v.animation;
        modePicker.value = v.liveOnly ? 'live' : v.mode;
        modePicker.disabled = gridPicker.disabled = v.liveOnly;
        clearButton.disabled = animated;
        pauseButton.hidden = !v.liveOnly;
        dropButton.hidden = !v.sim;
        document.getElementById('edit-hints').hidden = animated;
        document.getElementById('physics-hint').hidden = !v.sim;
        pauseButton.textContent = v.paused ? 'Play' : 'Pause';
        for (const b of toolButtons) {
          b.setAttribute('aria-pressed', b.dataset.tool === v.tool);
          b.disabled = animated;
        }
      };

      const viewer = new Viewer(document.getElementById('view'), showError, refresh);
      window.viewer = viewer; // handy from the devtools console

      modePicker.addEventListener('change', () => viewer.setMode(modePicker.value));
      gridPicker.addEventListener('change', () => viewer.setGrid(+gridPicker.value));
      clearButton.addEventListener('click', () => viewer.clearEdits());
      cutSlider.addEventListener('input', () => viewer.setCut({ amount: cutSlider.value / 100 }));
      cutAxis.addEventListener('change', () => viewer.setCut({ axis: cutAxis.value }));
      cutFlip.addEventListener('click', () => viewer.setCut({ flip: !viewer.cut.flip }));
      pauseButton.addEventListener('click', () => viewer.setPaused(!viewer.paused));
      dropButton.addEventListener('click', () => viewer.dropAgain());
      for (const b of toolButtons) {
        b.addEventListener('click', () => viewer.setTool(viewer.tool === b.dataset.tool ? 'orbit' : b.dataset.tool));
      }

      for (const [key, scene] of Object.entries(SDF.scenes)) picker.add(new Option(scene.label, key));

      const load = (key) => {
        errorBox.hidden = true;
        try {
          viewer.setScene(SDF.scenes[key]);
          picker.value = key;
        } catch (e) {
          showError(e.message);
        }
      };

      picker.addEventListener('change', () => { location.hash = picker.value; });

      // #car, or #car/theta/phi/dist to open at a specific view.
      const fromHash = () => {
        const [key, theta, phi, dist] = location.hash.slice(1).split('/');
        load(SDF.scenes[key] ? key : 'car');
        if (dist) {
          const view = { theta: +theta, phi: +phi, dist: +dist };
          Object.assign(viewer.cam, view);
          Object.assign(viewer.goal, view);
        }
      };
      addEventListener('hashchange', fromHash);
      fromHash();
    } catch (e) {
      showError(e.message);
    }
  </script>
</body>
</html>
